<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8f7f4" />
  <meta name="description" content="T and mo — لوحة إدارة المتجر" />
  <title>T and mo · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-lockup">
        <div class="brand-mark">T</div>
        <div class="brand-copy"><strong>T and mo</strong><span data-i18n="adminSpace">مساحة الإدارة</span></div>
      </div>
      <button class="sidebar-collapse" id="sidebarCollapse" aria-label="تصغير القائمة"><i data-lucide="panel-left-close"></i></button>
      <nav class="nav-list" id="navList" aria-label="التنقل الرئيسي"></nav>
      <div class="sidebar-footer">
        <div class="connection-pill" id="connectionPill"><span class="status-dot"></span><span data-i18n="checkingConnection">فحص الاتصال…</span></div>
        <div class="admin-chip" id="adminChip"><div class="avatar">A</div><div><strong id="adminName">وضع القراءة</strong><span id="adminRole">غير مصادق</span></div></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-start">
          <button class="icon-button mobile-only" id="mobileMenu" aria-label="فتح القائمة"><i data-lucide="menu"></i></button>
          <div class="page-heading"><span class="eyebrow" id="pageEyebrow">T AND MO / ADMIN</span><h1 id="pageTitle">نظرة عامة</h1></div>
        </div>
        <div class="topbar-actions">
          <label class="global-search"><i data-lucide="search"></i><input id="globalSearch" type="search" placeholder="ابحث في الصفحة الحالية…" autocomplete="off" /></label>
          <span class="today-label" id="todayLabel"></span>
          <button class="icon-button" id="notificationButton" title="الإشعارات" aria-label="الإشعارات"><i data-lucide="bell"></i><span class="notification-badge hidden" id="notificationBadge">0</span></button>
          <button class="icon-button" id="themeToggle" title="تبديل المظهر" aria-label="تبديل المظهر"><i data-lucide="sun"></i></button>
          <button class="language-button" id="languageToggle">EN</button>
        </div>
      </header>

      <div class="access-banner hidden" id="accessBanner"><i data-lucide="shield-alert"></i><div><strong data-i18n="readOnlyTitle">وضع القراءة فقط</strong><span id="accessMessage">لا توجد جلسة مدير موثقة. ستظهر البيانات المتاحة دون السماح بالتعديل.</span></div><span class="access-state" id="accessState">READ ONLY</span></div>
      <section class="content" id="content" aria-live="polite"></section>
    </main>
  </div>

  <div class="toast-stack" id="toastStack"></div>
  <div class="modal-backdrop hidden" id="modalBackdrop"><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-header"><div><span class="eyebrow" id="modalEyebrow">T AND MO</span><h2 id="modalTitle">تفاصيل</h2></div><button class="icon-button" id="modalClose" aria-label="إغلاق"><i data-lucide="x"></i></button></div><div id="modalBody"></div></section></div>
  <div class="drawer-backdrop hidden" id="drawerBackdrop"><aside class="drawer" id="drawer"><div class="modal-header"><div><span class="eyebrow">T AND MO / DETAIL</span><h2 id="drawerTitle">التفاصيل</h2></div><button class="icon-button" id="drawerClose" aria-label="إغلاق"><i data-lucide="x"></i></button></div><div id="drawerBody"></div></aside></div>

  <template id="loadingTemplate"><div class="loading-state"><div class="spinner"></div><strong data-i18n="loading">جارٍ تحميل البيانات…</strong><span data-i18n="loadingHint">نتحقق من أحدث حالة في Supabase.</span></div></template>
  <script src="script.js"></script>
</body>
</html>
